<!DOCTYPE html>
<html lang="de" data-projekt="sprechtag">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sprechtag FRG</title>
<!-- Tokens zuerst, die projekteigene Datei zuletzt: So gewinnt style.css
     im Zweifel, und die Werte kommen dennoch aus einer Quelle. -->
<link rel="stylesheet" href="/vendor/ci-css/ci-tokens.css?v=20260818000839">
<link rel="stylesheet" href="/style.css?v=20260818000839">
</head>
<body>

<a href="#hauptinhalt" class="skip-link">Zum Inhalt springen</a>

<div class="shell" data-ci-icons="/vendor/ci-css/ci-icons.svg?v=20260818000839">
  <!-- Mobile: Kopfleiste mit Hamburger -->
  <div class="mobil-leiste">
    <button type="button" id="mobil-menue" class="hamburger" aria-label="Menü"
            aria-expanded="false" aria-controls="seitenleiste">
      <span></span><span></span><span></span>
    </button>
    <span id="mobil-titel" class="mobil-titel">Sprechtag</span>
  </div>

  <aside id="seitenleiste" class="seitenleiste">
    <div class="marke">
      <button type="button" id="leiste-einklappen" class="leiste-einklappen"
              aria-label="Menü einklappen" title="Menü einklappen">«</button>
      <!-- alt="" statt alt="Logo": Das Bild steht direkt neben dem Titel
           und ist rein dekorativ. Sonst läse ein Screenreader
           „Grafik Logo Sprechtag Friedrich-Rückert-Gymnasium". -->
      <img id="marke-logo" class="marke-logo versteckt" alt="">
      <!-- Der Anwendungstitel ist die oberste Überschrift der Seite.
           Vorher war er ein <div>, und die Gliederung begann bei <h2> –
           wer per Überschriftensprung navigiert, fand keinen Einstieg. -->
      <h1 class="marke-titel" id="marke-titel">Sprechtag</h1>
      <div class="marke-untertitel" id="marke-untertitel">Friedrich-Rückert-Gymnasium Düsseldorf</div>
    </div>
    <nav id="navigation" class="navigation" aria-label="Hauptnavigation"></nav>
    <div class="seitenleiste-fuss">
      <div id="benutzer-box" class="benutzer-box versteckt">
        <span id="benutzer-name"></span>
        <span id="benutzer-rolle" class="badge"></span>
      </div>
      <span id="marke-fusszeile">sprechtag · GPL-3.0-or-later · Sebastian Horn</span>
      <!-- Die Version steht in einem EIGENEN Element, nicht in der
           Fußzeile. Beides in denselben Text zu schreiben ließ Branding
           und Versionsanzeige um dieselbe Stelle konkurrieren: Hat das
           Branding eine Fußzeile hinterlegt – und das hatte es –, fiel
           die Version stillschweigend weg.
           app.js trägt sie aus /api/health nach; fest im HTML wurde sie
           bei jedem Release von Hand gepflegt und zeigte irgendwann
           dauerhaft eine falsche Zahl. -->
      <span id="marke-version"></span>
    </div>
  </aside>

  <!-- Erscheint, wenn die Seitenleiste eingeklappt ist (Desktop/Tablet) -->
  <button type="button" id="leiste-ausklappen" class="leiste-ausklappen"
          aria-label="Menü ausklappen" title="Menü ausklappen">☰</button>

  <!-- Overlay zum Schließen des mobilen Menüs -->
  <div id="menue-overlay" class="menue-overlay"></div>

  <!-- Kurzmeldung ohne Neuzeichnen (Toast). aria-live sagt sie Screenreadern an. -->
  <div id="toast" class="toast versteckt" role="status" aria-live="polite"></div>

  <main id="hauptinhalt" tabindex="-1">
    <section id="ansicht" class="karte">
      <p class="hinweis">Wird geladen …</p>
    </section>
  </main>
</div>

<script src="/app.js?v=20260818000839"></script>
</body>
</html>
