<!-- VENDORED aus hornse/ci-css v1.7.0 – dort ändern, hierher kopieren! -->
<!--
  ci-icons.svg – Symbolsatz der FRG-Projektreihe

  Ein Sprite mit <symbol>-Elementen. Verwendung:

    <svg class="ci-symbol" aria-hidden="true">
      <use href="/vendor/ci-css/ci-icons.svg#ci-i-inhalte"></use>
    </svg>

  Alle Symbole sind 24×24, reine Striche mit 2px Breite und runden
  Enden. Die Farbe kommt über currentColor aus dem umgebenden Text –
  deshalb steht hier kein einziger Farbwert.

  WICHTIG: Die Strichangaben stehen als Präsentationsattribute an
  jedem <symbol>, NICHT in einem <style>-Block. Bei
  <use href="fremde-datei.svg#id"> klont der Browser nur den
  <symbol>-Teilbaum; ein Stylesheet aus der fremden Datei kommt nicht
  mit. Mit <style> wären die Symbole ohne Kontur und damit unsichtbar.

  Selbst gezeichnet, keine Fremdlizenz. Die Formen sind bewusst
  einfach gehalten; wer später ein umfangreicheres Set einsetzen will
  (etwa Tabler Icons, MIT), tauscht diese Datei aus, ohne dass ein
  Projekt etwas ändern muss – die IDs bleiben.

  Copyright (C) 2026 Sebastian Horn, Friedrich-Rückert-Gymnasium
  SPDX-License-Identifier: GPL-3.0-or-later
  ci-css v1.1.0
-->
